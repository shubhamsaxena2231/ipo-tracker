name: Lifetime IPO Tracker
on:
  schedule:
    - cron: '30 14 * * 1-5' # Runs at 8:00 PM IST on weekdays
  workflow_dispatch: # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    # Explicitly grants the GitHub Actions bot permission to save the CSV back to the repo
    permissions:
      contents: write 
      
    steps:
      # Updated from v3 to v4 to fix the Node.js 20 deprecation warning
      - uses: actions/checkout@v4 
      
      # Updated from v4 to v5
      - uses: actions/setup-python@v5 
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        # Added beautifulsoup4 to fix the ImportError
        run: pip install pandas requests lxml html5lib beautifulsoup4
        
      - name: Run Upsert Script
        run: python scraper.py
        
      - name: Commit and Push Archive
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add ipo_tracker.csv
          git commit -m "Automated IPO archive update" || exit 0
          git push

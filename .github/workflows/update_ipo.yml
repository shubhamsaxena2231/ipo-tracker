name: Lifetime IPO Tracker
on:
  schedule:
    - cron: '30 14 * * 1-5' 
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pandas requests lxml html5lib
      - run: python scraper.py
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add ipo_tracker.csv
          git commit -m "Daily IPO update" || exit 0
          git push
